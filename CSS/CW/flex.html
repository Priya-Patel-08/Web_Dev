<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex</title>
    <style>
    .box {
        display: flex;
        flex-direction: column-reverse;
        gap: 20px;
        background-color: Blue;
    }
    .box div {
        background-color: aliceblue;
        margin: 10px;
        padding: 20px;
        font-size: 25px;
    }
    </style>
</head>
<body>
    <h1>Create a Flex Container</h1>
    <div class="box">
      <div>Item 1</div>
      <div>Item 2</div>
      <div>Item 3</div>
    </div>

    <p>
      Flexbox must have a parent element with the display property set to flex
      or inline-flex.
    </p>
    <p>
      Direct child elements of the flex container automatically becomes flex
      items.
    </p>
  </body>
</html>
