<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index Property</title>
    <style>
        img {
            position: absolute;
            left: 0;
            right: 0;
            z-index: -1;
        }
    </style>
</head>
<body>
    <img src="Image.jpeg" alt="Image" width="300" height="300">
    <h1>This is heading</h1>
</body>
</html>
