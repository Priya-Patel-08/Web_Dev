<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition+Transform</title>
    <style>
      div {
        width: 100px;
        height: 100px;
        background-color: red;
        transition:
          width 2s,
          height 2s,
          background-color 2s,
          transform 2s;
      }

      div:hover {
        width: 300px;
        height: 300px;
        background-color: orange;
        transform: rotate(180deg);
      }
    </style>
  </head>
  <body>
    <div>TEXT</div>
  </body>
</html>
