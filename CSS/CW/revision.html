<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        .container1 {
            position:  relative;
            background-color: blue;
            height: 400px;
            width: 500px;
            border-radius: 10px;
        }
        .container2 {
            background-color: green;
            height: 200px;
            width: 200px;
            position: absolute;
            left: 0;
            bottom: 0;
            border-radius: 10px;
        }
        .text1 {
            position: absolute;
            right: 2px;
        }
        .text2 {
            position: absolute;
            right: 2px;
        }
    </style>
</head>
<body>
    <div class="container1">
        <p class="text1">Div1</p>
        <div class="container2">
            <p class="text2">Div2</p>
        </div>
    </div>
</body>
</html>
