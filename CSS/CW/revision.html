<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        .container1 {
            position:  relative;
            background-color: blue;
            height: 400px;
            width: 500px;
            text-align: end;
            border-radius: 10px;
        }
        .container2 {
            background-color: green;
            height: 200px;
            width: 200px;
            position: absolute;
            text-align: end;
            left: 0;
            bottom: 0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container1">
        Div1 &nbsp
        <div class="container2">
            Div2 &nbsp
        </div>
    </div>
</body>
</html>
