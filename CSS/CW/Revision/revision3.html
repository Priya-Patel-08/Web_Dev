<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        .container {
            background-color: lightgrey;
            position: relative;
            height: 400px;
            width: 500px;
        }
        #first {
            position: absolute;
            top: 0.5vh;
            width: 100%;
            text-align: center;
        }
        #second {
            position: absolute;
            top: 46%;
            left: 0.5vh;
        }
        #third {
            position: absolute;
            top: 46%;
            right: 0.5vh;
        }
        #fourth {
            position: absolute;
            width: 100%;
            text-align: center;
            bottom: 0.5vh;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <p id="first">Priya</p>
        <p id="second">Priya</p>
        <p id="third">Priya</p>
        <p id="fourth">Priya</p>
    </div>
</body>
</html>
