    <h2>HTML Forms</h2>

    <form action="/action_page.php">

      <label for="fname">First name:</label><br />

        type="text"
        id="fname"
        name="fname"
        placeholder="First name"

      <!-- Label and Input for lastname -->

        type="text"
        id="lname"

      /><br /><br />

    </form>
