<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Login Form</h1>
    <form action="" method="post">
      <label for="uname"><b>Username:</b></label>
      <input type="text" id="uname" placeholder="Enter Username" required />
      <br />
      <br />
      <label for="psw"><b>Password:</b></label>
      <input type="password" id="psw" placeholder="Enter Password" required />
      <br />
      <span class="psw"><a href="#">Forgot password?</a></span> <br />
      <br />
      <label for="gender"><b>Gender:</b></label>
      <input type="radio" id="gender" name="gender" />Male
      <input type="radio" id="gender" name="gender" /> Female
      <input type="radio" id="gender" name="gender" /> Others <br />
      <br />
      <label for="dob"><b>Date of Birth:</b></label>
      <input type="date" id="dob" name="dob" />
      <br />
      <br />
      <label for="pno"><b>Phone Number:</b></label>
      <input
        type="number"
        id="pno"
        name="pno"
        placeholder="Enter phone number"
      />
      <br />
      <p>
        By creating an account you agree to out
        <a href="#">Terms & conditions</a>
      </p>
      <button type="submit">SignUp</button>
      <label>
        <input type="checkbox" checked="checked" name="remember" /> Remember me
      </label>
      <br />
      <div class="container">
        
        <br />

        <button type="button" class="cancelbtn">Cancel</button>
      </div>
    </form>
  </body>
</html>
